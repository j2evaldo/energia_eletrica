# This is a Declarative Automation Bundle definition for Grid Intelligence.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: grid_intelligence
  uuid: 28a9fc7e-13dd-495a-a362-cee3b0fc31ac

include:
  - resources/*.yml

# Sem isso, mode: development prefixa os schemas com o nome do usuario e
# "bronze" vira "meunome_bronze". O isolamento entre ambientes e feito pelo
# catalogo, nao pelo nome do schema.
experimental:
  skip_name_prefix_for_schema: true

variables:
  catalog:
    description: Catalogo que isola o ambiente (dev = grid_dev, prod = grid_intelligence)

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-9a5431a6-5f39.cloud.databricks.com
      profile: grid_inteligence
    variables:
      catalog: grid_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-9a5431a6-5f39.cloud.databricks.com
      profile: grid_inteligence
      root_path: /Workspace/Users/evaldoazeredoc@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: grid_intelligence
    permissions:
      - user_name: evaldoazeredoc@gmail.com
        level: CAN_MANAGE
