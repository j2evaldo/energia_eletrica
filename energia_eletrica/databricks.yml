# This is a Declarative Automation Bundle definition for energia_eletrica.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: energia_eletrica
  uuid: 28a9fc7e-13dd-495a-a362-cee3b0fc31ac

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-9a5431a6-5f39.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-9a5431a6-5f39.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/evaldoazeredoc@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/evaldoazeredoc@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: evaldoazeredoc@gmail.com
        level: CAN_MANAGE
